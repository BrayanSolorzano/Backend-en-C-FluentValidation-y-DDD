version: '3.8'

services:
  db:
    image: postgres:15
    container_name: marcasautos_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: MarcasAutosDb
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marcasautos_api
    depends_on:
      - db
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Database=MarcasAutosDb;Username=postgres;Password=postgres
    ports:
      - "5000:8080"

volumes:
  postgres_data:
